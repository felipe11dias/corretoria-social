# O projeto é construído etapa a etapa: no scaffold (Etapa 2) quase todos os pacotes ainda
# estão vazios, e o padrão do ArchUnit é FALHAR quando a cláusula that() não casa com nenhuma
# classe. Sem esta linha o ArchitectureTest reprovaria por ausência de código, não por
# violação de arquitetura.
#
# Isto é dívida consciente e temporária: remover na Etapa 12, quando todos os pacotes
# estiverem populados, para que uma regra que deixe de casar com qualquer classe volte a
# falhar — sinal de que o pacote foi renomeado ou esvaziado.
archRule.failOnEmptyShould=false
