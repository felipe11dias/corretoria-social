services:

  db:
    image: postgres:16
    container_name: corretoria-db
    environment:
      POSTGRES_DB: ${DB_NAME:-corretoria-app}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # O app só sobe depois que o banco aceita conexão — sem isso o Flyway
      # tenta migrar antes do PostgreSQL estar pronto e a aplicação morre no boot.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-corretoria-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Armazenamento S3-compatible das fotos de anúncio. Em desenvolvimento é MinIO; em
  # produção o mesmo cliente aponta para o S3 gerenciado, sem mudança de código.
  storage:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: corretoria-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # A imagem do MinIO não traz curl nem wget; o cliente `mc` que ela embarca já responde
      # pela saúde do cluster, e é o healthcheck que a própria MinIO documenta.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Cria o bucket e libera a leitura anônima uma única vez, na subida. O catálogo de
  # anúncios é público (regra 5 da Fase 2), então a foto também é — o que exige token é
  # publicar, não olhar. Reusa a imagem do MinIO, que já traz o cliente `mc`.
  storage-init:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: corretoria-storage-init
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set corretoria http://storage:9000
      ${STORAGE_ACCESS_KEY:-minioadmin} ${STORAGE_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing corretoria/${STORAGE_BUCKET:-corretoria-listing-photos} &&
      mc anonymous set download corretoria/${STORAGE_BUCKET:-corretoria-listing-photos}
      "
    restart: "no"

  # Servidor SMTP de desenvolvimento: aceita qualquer mensagem, não entrega a ninguém e
  # mostra tudo numa caixa de entrada web. É o que permite exercitar a notificação por
  # e-mail sem mandar mensagem de teste para endereço real de ninguém.
  mail:
    image: axllent/mailpit:v1.21
    container_name: corretoria-mail
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "${MAIL_WEB_PORT:-8025}:8025"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: corretoria-api:1.1.0
    container_name: corretoria-app
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      # Dentro da rede do compose o host do banco é o nome do serviço.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-corretoria-app}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-de-exemplo-por-um-de-no-minimo-256-bits}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      # Dois endereços de propósito: a aplicação fala com o MinIO pela rede do compose
      # (host `storage`), enquanto o link devolvido na API é aberto pelo navegador, fora
      # dessa rede (host `localhost`).
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-corretoria-listing-photos}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      # Dentro da rede do compose o host do SMTP é o nome do serviço.
      MAIL_HOST: mail
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-nao-responda@corretoria.app}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
